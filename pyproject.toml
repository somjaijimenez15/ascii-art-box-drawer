[project]
name = "ascii-art-box-drawer"
version = "0.1.3"
description = "Wraps text in single, double, or rounded border boxes using pure ASCII characters."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
